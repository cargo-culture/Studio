[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "atelier3a"
version = "0.1.0"
description = "Atelier3A (A3A), a GitHub-centered three-agent software studio orchestrator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
a3a = "studio_runner.cli:main"
studio = "studio_runner.cli:main"

[tool.setuptools]
packages = ["studio_runner"]

[tool.setuptools.package-data]
studio_runner = ["template/**/*", "template/**/.*"]
